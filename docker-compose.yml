# =============================================================================
# docker-compose.yml — Project GEMA (dev / build-from-source)
# Usage: docker compose up --build
# Serves the React UI + FastAPI on http://localhost:8000
# =============================================================================

services:
  gema:
    build: .
    # Solo loopback. La API no tiene autenticacion —CV, setup, scheduler y reset
    # quedan abiertos a quien alcance el puerto—, y "8000:8000" publica en TODAS las
    # interfaces: cualquiera en la misma red WiFi podia leer el perfil o disparar un
    # reset. Abrirla a otra maquina pide autenticacion primero, no cambiar esta linea.
    ports:
      - "127.0.0.1:8000:8000"

    # Load API keys from your local .env file — never baked into the image
    env_file:
      - .env

    # Todo lo que la app escribe vive en UN directorio del host: ./data -> /data.
    # La imagen fija RESONANCE_HOME=/data y arranca con /data como directorio de
    # trabajo, asi que la base, la estrategia de boards, los backups, las cookies, las
    # credenciales, api_state.json y el .env se resuelven ahi. Es un directorio, no
    # archivos sueltos: un bind mount de un archivo que no existe en el host lo crea
    # como carpeta con el nombre del archivo y la app arranca rota. Docker crea ./data
    # si falta; las claves de la API pueden venir de `.env` (arriba) o de ./data/.env.
    # Cookies de sesion (DevTools, JSON): ./data/cookies/<dominio>.json
    volumes:
      - ./data:/data

    environment:
      RESONANCE_HOME: /data

    restart: unless-stopped
