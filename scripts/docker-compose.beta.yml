# =============================================================================
# docker-compose.beta.yml — GEMA Beta Distribution
# Used by beta recipients — no build step, uses the pre-packaged image.
# el usuario: copy this to dist/docker-compose.yml when packaging for a friend.
# Serves the React UI + FastAPI on http://localhost:8000
# =============================================================================

services:
  gema:
    image: gema:beta-v1
    ports:
      - "8000:8000"

    # Load API keys from .env — filled by the setup wizard on first run
    env_file:
      - .env

    volumes:
      # Persist the SQLite job registry across container restarts
      - ./gema_registry.db:/app/gema_registry.db
      # Manual cookie exports (EditThisCookie V3 JSON), read-only.
      - ./cookies:/app/cookies:ro
      # Cookie jar (SessionJar) writes here — MUST be read-write so the jar
      # persists cf_clearance between runs. Overlays the ro cookies/ mount above.
      - ./cookies/session:/app/cookies/session

    restart: unless-stopped
